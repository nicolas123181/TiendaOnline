name: Wishlist Email Notifications

on:
  # 08:00 UTC diariamente
  schedule:
    - cron: "0 8 * * *"

  # Permite ejecución manual
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wishlist-notifications
  cancel-in-progress: false

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

jobs:
  send-notifications:
    name: Send Wishlist Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail

          if [[ -z "${SITE_URL:-}" ]]; then
            echo "❌ Missing required secret: SITE_URL"
            exit 1
          fi

          if [[ -z "${ADMIN_API_KEY:-}" ]]; then
            echo "❌ Missing required secret: ADMIN_API_KEY"
            exit 1
          fi

          if [[ ! "$SITE_URL" =~ ^https?:// ]]; then
            echo "❌ SITE_URL must start with http:// or https://"
            exit 1
          fi

          CLEAN_SITE_URL="${SITE_URL%/}"
          echo "clean_site_url=$CLEAN_SITE_URL" >> "$GITHUB_OUTPUT"
        id: validate

      - name: Send Low Stock Notifications (with retry)
        id: low_stock
        env:
          ENDPOINT_URL: ${{ steps.validate.outputs.clean_site_url }}/api/admin/wishlist-notifications
        run: |
          set -euo pipefail

          echo "📦 Calling: $ENDPOINT_URL"

          last_http_code=""
          last_body=""

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."

            response=$(curl -sS -w "\n%{http_code}" -X POST \
              "$ENDPOINT_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $ADMIN_API_KEY" \
              --connect-timeout 10 \
              --max-time 60)

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            last_http_code="$http_code"
            last_body="$body"

            echo "HTTP: $http_code"
            echo "Body: $body"

            if [[ "$http_code" == "200" ]]; then
              body_ok=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        ok=data.get("success", True)
        print("true" if ok else "false")
      except Exception:
        print("false")' "$body")

              if [[ "$body_ok" == "true" ]]; then
              sent=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        print(data.get("sentCount", 0))
      except Exception:
        print(0)' "$body")

              marked=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        print(data.get("markedCount", 0))
      except Exception:
        print(0)' "$body")

                echo "sent_count=$sent" >> "$GITHUB_OUTPUT"
                echo "marked_count=$marked" >> "$GITHUB_OUTPUT"
                echo "✅ Low stock notifications completed"
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep_seconds=$((attempt * 5))
              echo "Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "❌ Low stock notifications failed after 3 attempts"
          echo "Last HTTP code: $last_http_code"
          echo "Last body: $last_body"
          exit 1

      - name: Send Sale Notifications (with retry)
        id: sale
        env:
          ENDPOINT_URL: ${{ steps.validate.outputs.clean_site_url }}/api/admin/wishlist-sale-notifications
        run: |
          set -euo pipefail

          echo "🏷️ Calling: $ENDPOINT_URL"

          last_http_code=""
          last_body=""

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."

            response=$(curl -sS -w "\n%{http_code}" -X POST \
              "$ENDPOINT_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $ADMIN_API_KEY" \
              --connect-timeout 10 \
              --max-time 60)

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            last_http_code="$http_code"
            last_body="$body"

            echo "HTTP: $http_code"
            echo "Body: $body"

            if [[ "$http_code" == "200" ]]; then
              body_ok=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        ok=data.get("success", True)
        print("true" if ok else "false")
      except Exception:
        print("false")' "$body")

              if [[ "$body_ok" == "true" ]]; then
              sent=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        print(data.get("sentCount", 0))
      except Exception:
        print(0)' "$body")

              marked=$(python -c 'import json,sys
      raw=sys.argv[1].strip() if len(sys.argv)>1 else ""
      try:
        data=json.loads(raw) if raw else {}
        print(data.get("markedCount", 0))
      except Exception:
        print(0)' "$body")

                echo "sent_count=$sent" >> "$GITHUB_OUTPUT"
                echo "marked_count=$marked" >> "$GITHUB_OUTPUT"
                echo "✅ Sale notifications completed"
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep_seconds=$((attempt * 5))
              echo "Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "❌ Sale notifications failed after 3 attempts"
          echo "Last HTTP code: $last_http_code"
          echo "Last body: $last_body"
          exit 1

      - name: Summary
        if: success()
        run: |
          set -euo pipefail

          LOW_STOCK_SENT="${{ steps.low_stock.outputs.sent_count }}"
          LOW_STOCK_MARKED="${{ steps.low_stock.outputs.marked_count }}"
          SALE_SENT="${{ steps.sale.outputs.sent_count }}"
          SALE_MARKED="${{ steps.sale.outputs.marked_count }}"

          echo "## 📧 Wishlist Notifications" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ejecutado: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Low stock enviados: ${LOW_STOCK_SENT:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Low stock marcados: ${LOW_STOCK_MARKED:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ofertas enviadas: ${SALE_SENT:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ofertas marcadas: ${SALE_MARKED:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Automatización completada correctamente." >> "$GITHUB_STEP_SUMMARY"
